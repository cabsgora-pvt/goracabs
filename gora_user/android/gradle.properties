# 4G, not 2G: Jetifier rewrites the Flutter engine jars in parallel and ran out
# of heap at 2G ("Java heap space" in JetifyTransform), failing every APK build.
# Kept at 4G rather than Flutter's 8G template default so it fits a 16GB machine
# alongside the IDE without swapping.
org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:+HeapDumpOnOutOfMemoryError
org.gradle.parallel=true
org.gradle.daemon=true
android.useAndroidX=true
android.enableJetifier=true
kotlin.daemon.jvmargs=-Xmx1536m
# Disable Kotlin incremental compilation — it crashes when project + pub cache are on different drives
kotlin.incremental=false
