name: gora_driver
description: Gora Driver App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_bloc: ^8.1.3
  equatable: ^2.0.5
  shared_preferences: ^2.2.2
  cached_network_image: ^3.3.1
  fl_chart: ^0.68.0
  intl: ^0.19.0
  cupertino_icons: ^1.0.6
  google_maps_flutter: ^2.6.0
  http: ^1.2.0
  image_picker: ^1.0.7
  provider: ^6.1.2
  geolocator: ^12.0.0
  url_launcher: ^6.3.0
  razorpay_flutter: ^1.3.7
  audioplayers: ^6.1.0
  qr_flutter: ^4.1.0
  share_plus: ^10.0.0
  path_provider: ^2.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.1
  flutter_native_splash: ^2.4.1

# App launcher icon (run: dart run flutter_launcher_icons)
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/logo.png"
  min_sdk_android: 21
  adaptive_icon_background: "#010920"
  adaptive_icon_foreground: "assets/images/logo_fg.png"

# Splash screen (run: dart run flutter_native_splash:create)
flutter_native_splash:
  color: "#010920"
  image: assets/images/splashscreen.png
  android_gravity: center
  ios_content_mode: center
  android_12:
    color: "#010920"
    image: assets/images/splashscreen.png
  fullscreen: true

flutter:
  uses-material-design: true
  assets:
    - assets/images/
